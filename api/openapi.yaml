              $ref: "#/components/schemas/DashboardCardPatch"
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a dashboard card
      tags:
      - Dashboards
      x-sdk-params: false
    post:
      description: "Inserts a new card at the given zero-based `index` position in\
        \ the dashboard's card list. Cards already at that position and beyond are\
        \ shifted down. If `index` is out of range it is clamped to the nearest valid\
        \ position. Returns `400` when a row-break card has items or a control is\
        \ missing a variable or duplicates another control on the same card. Returns\
        \ `404` if the dashboard does not exist. Requires the *Edit org model* permission,\
        \ and the *Variable controls* permission when the card has controls."
      operationId: dashboards_create-cards
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardCardCreate"
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a card to a dashboard
      tags:
      - Dashboards
      x-sdk-params: false
