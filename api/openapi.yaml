  /v1/top-down-models/{id}:
    delete:
      description: "Controls the lifecycle of a top-down model. Pass `action=archive`\
        \ to move it to the archive, `action=restore` to bring it back, or `action=purge`\
        \ (the default when the parameter is omitted) to permanently delete the model\
        \ and all its entries. Requires the *Edit modification* permission."
      operationId: top-down-models_delete
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: "Lifecycle action: \"archive\" moves the model to the archive,\
          \ \"restore\" returns it to active, and \"purge\" permanently deletes it\
          \ along with all its entries. Defaults to \"purge\" when omitted."
        explode: false
        in: query
        name: action
        required: false
        schema:
          description: "Lifecycle action: \"archive\" moves the model to the archive,\
            \ \"restore\" returns it to active, and \"purge\" permanently deletes\
            \ it along with all its entries. Defaults to \"purge\" when omitted."
          enum:
          - archive
          - restore
          - purge
          type: string
        style: form
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
