          format: int64
          type: integer
        build:
          description: "Credits used building layer data: one per 1,000 objects written."
          format: int64
          type: integer
        date:
          description: UTC day the usage was recorded on.
          format: date
          type: string
        scripts:
          description: "Credits used running scripts: one per started minute of each\
            \ run."
          format: int64
          type: integer
