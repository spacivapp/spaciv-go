      parameters:
      - description: UUID of the conversation to delete.
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: UUID of the conversation to delete.
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a conversation
      tags:
      - Assistant
      x-sdk-params: false
  /v1/assistant/conversations/{id}/poll:
    get:
      description: "Reports whether the conversation's current turn is still running,\
        \ and returns the messages recorded since `since` - the thoughts and actions\
        \ of a turn in progress as well as its answer. Omitting `since` returns the\
        \ conversation from its start, which is how a client restores one it was in\
        \ the middle of. Returns `404` if the conversation does not exist and `400`\
        \ if `since` is not a message id. Requires the *AI assistant* permission."
      operationId: assistant_poll-conversations
      parameters:
      - description: UUID of the conversation to poll.
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: UUID of the conversation to poll.
          type: string
        style: simple
      - description: Id of the newest message the caller already has. Omit to read
          the conversation from its start.
        explode: false
        in: query
        name: since
        required: false
        schema:
          description: Id of the newest message the caller already has. Omit to read
            the conversation from its start.
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatPollBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Poll a conversation
      tags:
      - Assistant
      x-sdk-params: true
  /v1/assistant/conversations/{id}/stop:
    post:
      description: "Asks the assistant to stop the turn it is working on. The turn\
        \ ends at its next step - a tool call already sent finishes and is recorded\
        \ - so the conversation stays usable and keeps everything the turn did before\
        \ it was stopped. Succeeds with nothing to do if no turn is running. Stopping\
        \ a conversation also stops a subsession it is running. Returns `404` if the\
        \ conversation does not exist, and `409` if it is a subsession, which is stopped\
        \ only by stopping the conversation that started it. Requires the *AI assistant*\
        \ permission."
      operationId: assistant_stop-conversations
      parameters:
      - description: UUID of the conversation whose turn to stop.
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: UUID of the conversation whose turn to stop.
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stop the running turn
      tags:
      - Assistant
      x-sdk-params: false
  /v1/assistant/conversations/{id}/transcript:
    get:
      description: "Returns the conversation as it is stored, for debugging and evaluating\
        \ the assistant: every message the assistant has been shown, including the\
        \ results of its tool calls and the ids that pair each result with its call,\
        \ the summary that replaces the earliest messages once the conversation has\
        \ been compacted, and the stored conversation of every subsession the assistant\
        \ handed a task to. Returns `404` if the conversation does not exist. Requires\
        \ the *AI assistant* and *Download AI assistant conversation* permissions."
      operationId: assistant_get-conversations-transcript
      parameters:
      - description: UUID of the conversation to read.
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: UUID of the conversation to read.
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTranscriptBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a conversation's transcript
      tags:
      - Assistant
      x-sdk-params: false
  /v1/assistant/models:
    get:
      description: "Returns the LLM models the account permits the assistant to use,\
        \ together with the default model that `POST /v1/assistant/chat` would select\
        \ for the current account. An account that permits no models in particular\
        \ gets the whole catalogue. Requires the *AI assistant* permission."
      operationId: assistant_list-models
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantModelListBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List available assistant models
      tags:
      - Assistant
      x-sdk-params: false
  /v1/audit-logs:
    get:
      description: |-
        Returns a paginated list of audit-log entries for the account. Specify `entity` to restrict to a single entity type, or pass `entity=all` to retrieve changes across every type the caller has permission to see.

        Use `nextCursor` from the response as the `cursor` query parameter to fetch the next page.
      operationId: audit-log_list
      parameters:
      - description: "Entity type to query. One of: dashboard, property, scenario,\
          \ floorplan, space-ruleset, top-down-model, object-group, datacollection,\
          \ contribution, i18n, user, file, variable, script, upload-quarantine. Pass\
