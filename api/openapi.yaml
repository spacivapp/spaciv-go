          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete top-down model entries
      tags:
      - Top-down models
      x-sdk-params: false
    get:
      description: |-
        Returns entries belonging to the specified top-down model, along with the total entry count. Each entry describes a cohort of people and the property values assigned to them.

        Paging is optional: omitting `limit`, or passing 0, returns every entry from `start`. Requires the *View modification* permission.
      operationId: top-down-models_list-entries
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Zero-based index of the first entry to return. Defaults to 0.
        explode: false
        in: query
        name: start
        required: false
        schema:
          description: Zero-based index of the first entry to return. Defaults to
            0.
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: Maximum number of entries to return. Returns every entry from
          start when omitted or 0.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          description: Maximum number of entries to return. Returns every entry from
            start when omitted or 0.
          format: int32
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTopDownModelEntriesRes"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List entries of a top-down model
      tags:
      - Top-down models
      x-sdk-params: true
    put:
      description: "Upserts an entry on the specified top-down model. If an entry\
        \ with the given ID already exists it is updated; otherwise a new entry is\
