      - Logic layers
      x-sdk-params: false
    get:
      description: "Returns the illustrative image for a space ruleset. If no image\
        \ has been uploaded and `noFallback` is not set, a default image is generated\
        \ from the ruleset name. The response `Content-Type` header reflects the actual\
        \ image format. Requires the *View space rule sets* permission. Returns `403`\
        \ (`file quarantined: it matched a virus signature`) when a rescan found the\
        \ stored image matches a virus signature; the bytes are kept for investigation."
      operationId: logic-layers_get-space-rulesets-image
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: "When true, returns 404 if no custom image has been uploaded\
          \ rather than generating a default image from the ruleset name."
        explode: false
        in: query
        name: noFallback
        required: false
        schema:
          description: "When true, returns 404 if no custom image has been uploaded\
            \ rather than generating a default image from the ruleset name."
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
          headers:
            Content-Disposition:
              explode: false
              schema:
                type: string
              style: simple
            Content-Security-Policy:
              explode: false
              schema:
                type: string
              style: simple
            Content-Type:
              explode: false
              schema:
                type: string
              style: simple
            X-Content-Type-Options:
              explode: false
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      servers:
      - description: Production
        url: https://usercontent.spaciv.com
      - description: Local development
        url: http://localhost:8090
      summary: Get a space ruleset image
      tags:
      - Logic layers
      x-sdk-params: true
    post:
      description: "Uploads an illustrative image for a space ruleset. Send the file\
        \ as `multipart/form-data` with the field key `file`. Accepted MIME types:\
        \ `image/png`, `image/jpeg`, `image/gif`, `image/webp`, `image/svg+xml` (detected\
        \ from file bytes). No larger than 4 MB. Replaces any previously uploaded\
        \ image. Requires the *Edit space rule sets* permission."
      operationId: logic-layers_create-space-rulesets-image
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
