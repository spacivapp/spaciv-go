            0.
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: Maximum number of entries to return. Returns every entry from
          start when omitted or 0.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          description: Maximum number of entries to return. Returns every entry from
            start when omitted or 0.
          format: int32
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTopDownModelEntriesRes"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List entries of a top-down model
      tags:
      - Top-down models
      x-sdk-params: true
    put:
      description: "Upserts an entry on the specified top-down model. If an entry\
        \ with the given ID already exists it is updated; otherwise a new entry is\
        \ created. Supply the entry's ID in the request body (`id` field). Each `properties.map[].formula`\
        \ must be a per-object expression: numbers, static property references and\
        \ the add, subtract, multiply and divide operators. With `variable_controls`\
        \ enabled, formulas may also reference numeric account variables by `account:<id>`;\
        \ other variable references are rejected. `sumOf`, `select`, unknown operators\
        \ and references to unknown properties or nodes are rejected with `400` naming\
        \ the offending field. Returns `404` if the model does not exist. Requires\
        \ the *Edit modification* permission."
      operationId: top-down-models_update-entries
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopDownModelEntryUpdate"
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create or update a top-down model entry
      tags:
      - Top-down models
      x-sdk-params: false
  /v1/translations:
    post:
      description: Returns the full map of translation keys to localised strings for
        the requested locale. Clients should call this once on start-up and cache
        the result. No authentication required.
      operationId: localisation_create-translations
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/I18nTranslationsParamsWrapperBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Get translations
      tags:
      - Localisation
      x-sdk-params: false
  /v1/translations/export:
    post:
      description: Downloads all translation key/value pairs for the given locale
        as a UTF-8 CSV file. Requires the *Sys admin* permission.
      operationId: internal_create-translations-export
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/I18nTranslationsExportParamsWrapperBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
          headers:
            Content-Disposition:
              explode: false
              schema:
                type: string
              style: simple
            Content-Type:
              explode: false
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Export translations as CSV
      tags:
      - Internal
      x-sdk-params: false
  /v1/translations/import:
    post:
      description: Replaces the stored translations for the given locale with the
        rows supplied in `translations`. The first row is treated as a header and
        skipped. Requires the *Sys admin* permission.
      operationId: internal_create-translations-import
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/I18nTranslationsImportParamsWrapperBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/I18nTranslationsImportResponseWrapperBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Import translations from CSV
      tags:
      - Internal
      x-sdk-params: false
  /v1/user:
    delete:
      description: Permanently deletes the authenticated user's own account and all
        associated data. Requires the *Edit my user profile* permission. This action
        is irreversible.
      operationId: users_delete
      parameters: []
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete the current user's account
      tags:
      - Users
      x-sdk-params: false
    get:
      description: "Returns profile details for the authenticated user, including\
        \ name, title, employee ID, locale, and a client-side key-value store. Requires\
        \ the *View my user profile* permission."
      operationId: users_get
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV2GetResBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the current user's profile
      tags:
      - Users
      x-sdk-params: false
    patch:
      description: |-
        Applies a partial update to the authenticated user's own profile (name, title, employee ID, locale, client store, marketing preferences). To grant or revoke a role on another user, include `roleUser` (or `roleUserEmail`) and `role`; omitting `role` revokes the user's current role.

        Updating profile fields requires the `Edit my user profile` permission. Updating another user's role requires `Manage users`. Role changes are written to the audit log. Inviting a new user by email sends them a verification email.
      operationId: users_update
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserV2PatchReqBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a user's profile or role
      tags:
      - Users
      x-sdk-params: false
  /v1/user-roles:
    get:
      description: Returns the role names that the authenticated user is permitted
        to assign to others. `System-Admin` users see all roles; `Account-Owner` users
        see all roles except `System-Admin`; all other roles receive an empty list.
      operationId: users_list-user-roles
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List assignable roles
      tags:
      - Users
      x-sdk-params: false
  /v1/user/image:
    delete:
      description: Permanently removes the profile image for the authenticated user.
        Requires the *Edit my user profile* permission.
      operationId: users_delete-image
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserImageDeleteResponseWrapperBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete the current user's profile image
      tags:
      - Users
      x-sdk-params: false
    get:
      description: "Returns the raw image bytes for a user's profile photo, with the\
        \ `Content-Type` header set to the image's MIME type. Omit `id` to retrieve\
        \ the authenticated user's own image, or supply `id` to retrieve a colleague's\
        \ image (the target must belong to the same account). Supplying `id` requires\
        \ the *View my user profile* permission; retrieving your own image needs no\
        \ particular permission. Returns `403` (`file quarantined: it matched a virus\
        \ signature`) when a rescan found the stored image matches a virus signature;\
        \ the bytes are kept for investigation."
      operationId: users_get-image
      parameters:
      - description: "ID of another user whose image to retrieve. When omitted, returns\
          \ the authenticated user's own image. The target user must belong to the\
          \ same account."
        explode: false
        in: query
        name: id
        required: false
        schema:
          description: "ID of another user whose image to retrieve. When omitted,\
            \ returns the authenticated user's own image. The target user must belong\
            \ to the same account."
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
          headers:
            Content-Disposition:
              explode: false
              schema:
                type: string
              style: simple
            Content-Security-Policy:
              explode: false
              schema:
                type: string
              style: simple
            Content-Type:
              explode: false
              schema:
                type: string
              style: simple
            X-Content-Type-Options:
              explode: false
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      servers:
      - description: Production
        url: https://usercontent.spaciv.com
      - description: Local development
        url: http://localhost:8090
      summary: Get a user's profile image
      tags:
      - Users
      x-sdk-params: true
    put:
      description: "Uploads or replaces the authenticated user's profile photo. Send\
        \ a `multipart/form-data` body with the image in the `img` field. Accepted\
        \ MIME types: `image/png`, `image/jpeg`, `image/gif`, `image/webp`, `image/svg+xml`\
        \ (detected from file bytes). Maximum file size: 4 MiB. Requires the *Edit\
        \ my user profile* permission."
      operationId: users_update-image
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/files_create_account_files_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserImagePutResponseWrapperBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload a profile image
      tags:
      - Users
      x-sdk-params: true
  /v1/users:
    get:
      description: "Returns all users that belong to the authenticated user's account,\
        \ including their profile details and primary email address. Requires the\
        \ *View users* permission."
      operationId: users_list
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ListUserDetailsWithEmailRow"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List users in the current account
      tags:
      - Users
      x-sdk-params: false
    post:
      description: |-
        Creates a new spaciv user account for the given email address and sends a verification email with a magic link. The caller must pass `acceptTerms: true`.

        Always returns `200` even if the address is already registered (an "email in use" notification is sent instead), to prevent account enumeration. Disposable email domains are rejected with `401`.
      operationId: users_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserV2PostReqBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Register a new user
      tags:
      - Users
      x-sdk-params: false
  /v1/users/import:
    post:
      description: Creates or updates a batch of users and assigns each one a role
        within the current account. If a user with a given email address does not
        yet exist they are created. Requires the *Manage users* permission.
      operationId: users_create-import
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: "#/components/schemas/ImportBody"
              type: array
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Bulk import users
      tags:
      - Users
      x-sdk-params: false
  /v1/variables:
    get:
      description: "Returns the account-level variables shared by every project in\
        \ the account, sorted by name. IDs are qualified as `account:<id>`; use that\
        \ form when referencing the variable from a project, dashboard or URL override.\
        \ Project variables are returned by `GET /v1/project`. Requires the *View\
        \ projects* permission."
      operationId: variables_list
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableListRes"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List account variables
      tags:
      - Variables
      x-sdk-params: false
    post:
      description: Creates an account-level variable and returns its qualified `account:<id>`
        ID. `name` and `data` are required; number variables must satisfy their own
        range and step. Requires the *Manage my account* permission.
      operationId: variables_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableCreate"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an account variable
      tags:
      - Variables
      x-sdk-params: false
  /v1/variables/{id}:
    delete:
      description: "Deletes an account-level variable. Returns `409` while the variable\
        \ is referenced by a project override, project filter, dashboard or other\
        \ entity; each entry of `errors` carries the reference in `value`, or only\
        \ the count is given when the caller lacks the *View projects* permission.\
        \ Requires the *Manage my account* permission."
      operationId: variables_delete
      parameters:
      - description: "Account variable ID, either qualified (account:<id>) or bare."
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: "Account variable ID, either qualified (account:<id>) or bare."
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete an account variable
      tags:
      - Variables
      x-sdk-params: false
    get:
      description: Returns a single account-level variable with its qualified `account:<id>`
        ID. Returns `404` if it does not exist. Requires the *View projects* permission.
      operationId: variables_get
      parameters:
      - description: "Account variable ID, either qualified (account:<id>) or bare."
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: "Account variable ID, either qualified (account:<id>) or bare."
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableRes"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get an account variable
      tags:
      - Variables
      x-sdk-params: false
    patch:
      description: "Updates the name and/or default value of an account-level variable;\
        \ the new default applies to every project that does not override it. Setting\
        \ `delete` behaves like `DELETE /v1/variables/{id}`. Changing the variable's\
        \ type, or deleting it, is rejected with `409` while it is referenced. Changing\
        \ its data so that an existing project override no longer validates (for example,\
        \ a narrower number `min`/`max` or a different `step`) is also rejected with\
        \ `409`, listing the projects with invalid overrides. In both cases the error\
        \ details list the references when the caller has the *View projects* permission,\
        \ otherwise only their count. Requires the *Manage my account* permission."
      operationId: variables_update
      parameters:
      - description: "Account variable ID, either qualified (account:<id>) or bare."
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: "Account variable ID, either qualified (account:<id>) or bare."
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariablePatch"
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update an account variable
      tags:
      - Variables
      x-sdk-params: false
  /v1/variables/{id}/references:
    get:
      description: "Returns every place in the account that uses the account-level\
        \ variable: project value overrides, project filters, dashboard visualisations\
        \ and the modifier formulas of layers, across all projects including archived\
        \ ones. A variable can only be deleted, or have its type changed, when this\
        \ list is empty. Requires the *View projects* permission."
      operationId: variables_list-references
      parameters:
      - description: "Account variable ID, either qualified (account:<id>) or bare."
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: "Account variable ID, either qualified (account:<id>) or bare."
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferencesRes"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List account variable references
      tags:
      - Variables
      x-sdk-params: false
  /v1/version:
    get:
      description: "Returns the release version of the Spaciv platform, which is independent\
        \ of the `/v1` API version in the path, and the minimum frontend compatibility\
        \ version. No authentication required."
      operationId: service_get-version
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaVersionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Get release version
      tags:
      - Service
      x-sdk-params: false
