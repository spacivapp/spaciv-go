  /v1/analyse:
    post:
      description: "Runs the scenario through the calculation engine and returns the\
        \ result as labelled `axes` and a flat `values` array. The axes come in the\
        \ order given by `dimensions`, and `values` runs fastest along the last axis.\
        \ A `400` response with a structured `kind` field indicates a configuration\
        \ problem such as a missing scenario, property, or unmapped parameter — inspect\
        \ the `kind` and the accompanying detail object to identify what needs fixing.\
        \ A `variableOverrides` value outside the variable's range, step or `options`\
        \ is rejected with `400` and `kind` `variable_type_mismatch`; `options` sent\
        \ inside an override are ignored. Requires the *View ideal space* permission."
