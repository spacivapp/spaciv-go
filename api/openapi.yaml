  /v1/template-projects/{id}/mapping:
    get:
      description: "Returns the scenario and property mappings required to instantiate\
        \ the given template project in the caller's account. The response lists each\
        \ scenario and property referenced by the template's dashboards or by the\
        \ template project's own filters, paired with the matching entity in the caller's\
        \ account where one can be found by name, and a `resolved` flag that is false\
        \ where no counterpart was found. Use this before `POST /v1/projects` with\
        \ a `template` body to resolve the variable bindings. Returns `404` if the\
        \ template project does not exist, and `422` if the template project's own\
        \ filters use an object group, which cannot be mapped to another account.\
        \ Requires the *View projects* permission."
