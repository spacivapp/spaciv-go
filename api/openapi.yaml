openapi: 3.1.0
info:
  contact:
    email: support@spaciv.com
    name: spaciv support
  description: |-
    The spaciv API powers workplace planning: modelling how many people an
    organisation has, how they work, and how much space that requires.

    ## Getting started

    1. Exchange credentials for an access token using one of the operations under
       **Authentication**.
    2. Send that token on every subsequent request as `Authorization: Bearer <token>`.
    3. Access tokens are short lived. Call `POST /v1/auth/refresh-token` to obtain a new one
       before the old one expires.

    ## Conventions

    Every operation is versioned under `/v1`. Collections are plural
    (`GET /v1/dashboards` lists, `POST /v1/dashboards` creates) and
    individual records live beneath them (`/v1/dashboards/{id}`). Singular
    paths such as `/v1/account`, `/v1/project` and `/v1/user`
    refer to the record the access token was issued for.

    Request and response bodies are JSON. Timestamps are RFC 3339. Identifiers are
    opaque strings unless documented otherwise, and collection operations return the
    records visible to the account the token was issued for.

    Failures return an [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem
    document with a `detail` field describing what went wrong.
  title: spaciv API
  version: 1.0.0
servers:
- description: Production
  url: https://api.spaciv.com
- description: Local development
  url: http://localhost:8090
security:
- accessToken: []
tags:
- description: "Exchange credentials for an access token and keep it fresh, and manage\
    \ the long-lived API keys used for programmatic access. Every other section assumes\
    \ a valid token."
  name: Authentication
- description: "Organisation-level records: profile details, hostname, available sign-in\
    \ methods and onboarding progress."
  name: Accounts
- description: "Files uploaded against an account, available to the users in it whose\
    \ roles grant access to them."
  name: Files
- description: "People inside an account, the roles granted to them, and their profile\
    \ images."
  name: Users
- description: "The workspace that scenarios, datasets and dashboards belong to."
  name: Projects
- description: Prebuilt projects used as the starting point for a new one.
  name: Template projects
- description: "Account-level variables shared by projects, dashboards and analysis\
    \ inputs."
  name: Variables
- description: Named variants of a project used to compare different assumptions side
    by side.
  name: Scenarios
- description: The buildings and sites a project is modelled against.
  name: Properties
- description: "Reusable groupings of modelled objects, their entries and attached\
    \ files."
  name: Object groups
- description: Uploaded floor plan drawings and the space data derived from them.
  name: Floor plans
- description: "Rules that turn headcount and activity into required space, plus their\
    \ illustrative images."
  name: Space rulesets
- description: Ratio-driven space models built from organisation-wide totals rather
    than individual teams.
  name: Top-down models
- description: Demand estimates derived from a top-down model.
  name: Needs
- description: Collections of records that supply the numbers behind a model.
  name: Datasets
- description: "Surveys sent to colleagues to gather demand data, and the links and\
    \ QR codes that open them."
  name: Data collection
- description: "Survey responses submitted by a contributor, including the public\
    \ submission flow."
  name: Contributions
- description: Runs a scenario through the calculation engine and streams back the
    resulting model.
  name: Analysis
- description: "Saved layouts of cards that visualise a project's results, and the\
    \ individual cards placed on them."
  name: Dashboards
- description: Exports of a project's results as a downloadable document.
  name: Reports
- description: Conversational assistant backed by the project's data.
  name: Assistant
- description: Connections to third-party tools such as Slack.
  name: Integrations
- description: "Customer-supplied logo and sign-in page background, and the public\
    \ branding a sign-in page renders for a hostname."
  name: Branding
- description: Available locales and the translated strings served to clients.
  name: Localisation
- description: Static reference lists used to populate form fields.
  name: Lookups
- description: "A record of who changed what, and when."
  name: Audit log
- description: Liveness and build information for the API itself.
  name: Service
- description: Operations reserved for spaciv tooling. Not part of the supported surface
    and may change without notice.
  name: Internal
paths:
  /:
    get:
      description: Returns `ok` when the API is running and reachable. No authentication
        required. Use as a liveness probe.
      operationId: service_get
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Check service health
      tags:
      - Service
      x-sdk-params: false
  /v1/account:
    delete:
      description: "Permanently deletes the account the access token was issued for,\
        \ along with its projects and members. This cannot be undone. Requires the\
        \ *Manage my account* permission."
      operationId: accounts_delete
      parameters: []
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete the current account
      tags:
      - Accounts
      x-sdk-params: false
    get:
      description: "Returns the account the access token was issued for. Use `GET\
        \ /v1/account/profile` for the full profile, including address and notification\
        \ preferences. Requires the *View account overview* permission."
      operationId: accounts_get
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the current account
      tags:
      - Accounts
      x-sdk-params: false
    patch:
      description: Updates the account the access token was issued for. Only the fields
        present in the body are changed; omitted fields keep their current values.
        Requires the *Manage my account* permission.
      operationId: accounts_update
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPutReqBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update the current account
      tags:
      - Accounts
      x-sdk-params: false
  /v1/account/auth-options:
    get:
      description: |-
        Returns every sign-in method configured for the account the access token was issued for, enabled or not, so it can be administered, along with whether single sign-on is available at all. Requires the *Manage my account* permission.

        Use `/v1/auth/options/{hostname}` instead to render a sign-in screen.
      operationId: accounts_list-auth-options
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountGetAuthOptionsResBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the current account's sign-in methods
      tags:
      - Accounts
      x-sdk-params: false
    patch:
      description: |-
        Enables or disables sign-in methods for the account the access token was issued for, and returns the full set as it now stands. Methods left out of the body keep their current setting, and a method listed more than once takes its last entry.

        Disabling the last enabled method returns `400 last-auth-option-disabled`, and enabling `sso` returns `400 sso-not-configured` when the account has no OIDC provider or `400 sso-multiple-providers` when it has more than one, as signing in with SSO resolves exactly one provider. An `sso` method already enabled without exactly one provider does not count as an enabled method. Disabling `sso` stops sign-in through the account's own identity provider; an account whose single sign-on comes from a centrally managed shared provider keeps that route whatever this setting says. A concurrent change to the account's sign-in methods, or removal of the OIDC provider the result relies on, returns `409 auth-options-changed`, and the request may be retried. Requires the *Manage my account* permission.
      operationId: accounts_update-auth-options
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatchAuthOptionsReqBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AccountAuthOption"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update the current account's sign-in methods
      tags:
      - Accounts
      x-sdk-params: false
  /v1/account/files:
    get:
      description: |-
        Returns a page of the files stored against the account, most recently uploaded first. Files belonging to other accounts are never returned.

        When `nextCursor` is present there are more files to fetch; pass it back as `cursor` to retrieve the following page. A page may come back shorter than `limit` while still having a `nextCursor`.

        A file that has just been uploaded may not appear here immediately, so clients should add the record returned by the upload operation to their list rather than refetching. Requires the *View file storage* permission.
      operationId: files_list-account-files
      parameters:
      - description: Maximum number of files to return in this page.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Maximum number of files to return in this page.
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: Opaque pagination cursor returned as nextCursor by a previous
          response. A cursor is only valid for the account it was issued to.
        explode: false
        in: query
        name: cursor
        required: false
        schema:
          description: Opaque pagination cursor returned as nextCursor by a previous
            response. A cursor is only valid for the account it was issued to.
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the account's files
      tags:
      - Files
      x-sdk-params: true
    post:
      description: |-
        Stores a file against the account and returns the record describing it. Send the request as `multipart/form-data` with a single file field named `file`. The uploaded file's name becomes the record's `name`, so it must be non-empty, at most 255 bytes and free of `/` and `\`. Any media type is accepted; `mimeType` is detected from the file's contents rather than from its name or the type the client declared. Maximum file size is 25 MiB, and uploads are rejected if a virus scan fails.

        The files stored against an account may total at most 1 GiB. An upload that would take the account past that is rejected with 413 and no file is added to the account, though the uploaded bytes may briefly remain in storage until they are cleaned up; deleting files frees their space. A 409 means concurrent uploads kept changing the account's usage, and the upload can be retried as it stands.

        The response body is the same record shape the list operation returns, so a client can add it to a list it already holds instead of refetching. Requires the *Edit file storage* permission.
      operationId: files_create-account-files
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/files_create_account_files_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload a file to the account
      tags:
      - Files
      x-sdk-params: true
  /v1/account/files/{id}:
    delete:
      description: |-
        Permanently deletes a file stored against the account, removing both its record and its stored content. This cannot be undone and any link to the file stops working. The file's size stops counting towards the account's 1 GiB storage quota once its record is removed.

        The record is removed before the content, so a request that fails partway can leave the stored content behind; repeating the same request is what clears it. Deleting a file that is already gone succeeds rather than returning 404, so a failed delete should always be retried; that includes a 409, which means concurrent changes to the account's files kept changing its storage usage during the request. The identifier must be one returned by the upload or list operations; a malformed identifier is rejected with 400. Requires the *Edit file storage* permission.
      operationId: files_delete-account-files
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountFileDeleteResponseWrapperBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete an account file
      tags:
      - Files
      x-sdk-params: false
    patch:
      description: |-
        Changes the display name of a file stored against the account and returns the updated record. Only the name changes: the stored content, media type, size and identifier are untouched, so anything already referencing the file keeps working.

        The identifier must be one returned by the upload or list operations; a malformed identifier is rejected with 400. Returns 404 if the account has no file with this identifier. Requires the *Edit file storage* permission.
      operationId: files_update-account-files
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountFilePatchBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Rename an account file
      tags:
      - Files
      x-sdk-params: false
  /v1/account/files/{id}/content:
    get:
      description: |-
        Returns the stored bytes of a file held against the account, with the `mimeType` recorded at upload as the `Content-Type`. Files belonging to other accounts are never returned.

        Served only from the user content host, so that a stored file is isolated from the application's own origin; any other host returns 404. The response always carries `Content-Disposition: attachment` and `Content-Security-Policy: default-src 'none'`, so a file is downloaded rather than rendered even when the browser could display it.

        The identifier must be one returned by the upload or list operations; a malformed identifier is rejected with 400 and an unknown one with 404. Requires the *View file storage* permission. Returns `403` (`file quarantined: it matched a virus signature`) when a rescan found the stored file matches a virus signature; the bytes are kept for investigation.
      operationId: files_get-account-files-content
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
          headers:
            Content-Disposition:
              explode: false
              schema:
                type: string
              style: simple
            Content-Security-Policy:
              explode: false
              schema:
                type: string
              style: simple
            Content-Type:
              explode: false
              schema:
                type: string
              style: simple
            X-Content-Type-Options:
              explode: false
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      servers:
      - description: Production
        url: https://usercontent.spaciv.com
      - description: Local development
        url: http://localhost:8090
      summary: Download an account file
      tags:
      - Files
      x-sdk-params: false
  /v1/account/login-background:
    delete:
      description: "Removes the account's sign-in page background, so the sign-in\
        \ page falls back to the default Spaciv background. Requires the *Manage my\
        \ account* permission."
      operationId: branding_delete-account-login-background
      parameters: []
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete the sign-in page background
      tags:
      - Branding
      x-sdk-params: false
    get:
      description: "Returns the raw image bytes of the account's sign-in page background,\
        \ or `404` when none has been uploaded. Requires the *View account overview*\
        \ permission. Returns `403` (`file quarantined: it matched a virus signature`)\
        \ when a rescan found the stored image matches a virus signature; the bytes\
        \ are kept for investigation."
      operationId: branding_get-account-login-background
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
          headers:
            Content-Disposition:
              explode: false
              schema:
                type: string
              style: simple
            Content-Security-Policy:
              explode: false
              schema:
                type: string
              style: simple
            Content-Type:
              explode: false
              schema:
                type: string
              style: simple
            X-Content-Type-Options:
              explode: false
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      servers:
      - description: Production
        url: https://usercontent.spaciv.com
      - description: Local development
        url: http://localhost:8090
      summary: Get the sign-in page background
      tags:
      - Branding
      x-sdk-params: false
    put:
      description: "Replaces the full-screen background image shown on the account's\
        \ sign-in page. The request must be `multipart/form-data` with a single file\
        \ field named `login-background`. Accepted MIME types: `image/png`, `image/jpeg`,\
        \ `image/webp` (detected from file bytes). Maximum file size is 8 MiB. Requires\
        \ the *Manage my account* permission."
      operationId: branding_update-account-login-background
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/files_create_account_files_request"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload the sign-in page background
      tags:
      - Branding
      x-sdk-params: true
  /v1/account/logo:
    delete:
      description: Removes the stored `light` or `dark` logo variant for the account.
        Requires the *Manage my account* permission.
      operationId: branding_delete-account-logo
      parameters:
      - explode: false
        in: query
        name: type
        required: false
        schema:
          enum:
          - light
          - dark
          type: string
        style: form
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete the account logo
      tags:
      - Branding
      x-sdk-params: true
    get:
      description: "Returns the raw image bytes for the account's `light` or `dark`\
        \ logo variant. If the requested variant has no logo and `noFallback` is false,\
        \ the opposite variant is returned instead. Requires the *View account overview*\
        \ permission. A variant that a rescan found to match a virus signature is\
        \ quarantined: it is skipped in favour of the opposite variant unless `noFallback`\
        \ is true, and returns `403` (`file quarantined: it matched a virus signature`)\
        \ otherwise."
      operationId: branding_get-account-logo
      parameters:
      - description: Which logo variant to retrieve. Falls back to the opposite variant
          unless noFallback is true.
        explode: false
        in: query
        name: type
        required: false
        schema:
          description: Which logo variant to retrieve. Falls back to the opposite
            variant unless noFallback is true.
          enum:
          - light
          - dark
          type: string
        style: form
      - description: Account ID to retrieve the logo for. Only honoured when the caller
          has the *Manage accounts* permission; otherwise the caller's own account
          is used.
        explode: false
        in: query
        name: id
        required: false
        schema:
          description: Account ID to retrieve the logo for. Only honoured when the
            caller has the *Manage accounts* permission; otherwise the caller's own
            account is used.
          format: int64
          type: integer
        style: form
      - description: "When true, returns 404 instead of falling back to the opposite\
          \ variant if the requested type has no logo."
        explode: false
        in: query
        name: noFallback
        required: false
        schema:
          description: "When true, returns 404 instead of falling back to the opposite\
            \ variant if the requested type has no logo."
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
          headers:
            Content-Disposition:
              explode: false
              schema:
                type: string
              style: simple
            Content-Security-Policy:
              explode: false
              schema:
                type: string
              style: simple
            Content-Type:
              explode: false
              schema:
                type: string
              style: simple
            X-Content-Type-Options:
              explode: false
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      servers:
      - description: Production
        url: https://usercontent.spaciv.com
      - description: Local development
        url: http://localhost:8090
      summary: Get the account logo
      tags:
      - Branding
      x-sdk-params: true
    put:
      description: "Replaces the account's logo with the uploaded image. The request\
        \ must be `multipart/form-data` with a single file field named `logo-dark`\
        \ or `logo-light`. Accepted MIME types: `image/png`, `image/jpeg`, `image/gif`,\
        \ `image/webp`, `image/svg+xml` (detected from file bytes). Maximum file size\
        \ is 4 MiB. Requires the *Manage my account* permission."
      operationId: branding_update-account-logo
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/files_create_account_files_request"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload the account logo
      tags:
      - Branding
      x-sdk-params: true
  /v1/account/oidc-provider:
    delete:
      description: |-
        Removes the identity provider of the account the access token was issued for, together with its client secret, and disables the `sso` sign-in method in the same change. Sessions signed in through the provider can no longer refresh an access token scoped to the account.

        Returns `400 last-auth-option-disabled` when single sign-on is the account's only enabled member sign-in method, `404 oidc-provider-not-configured` when the account has no provider, and `409 auth-options-changed` when the account's sign-in methods or its provider changed concurrently, in which case the request may be retried. The change is written to the audit log. Requires the *Manage my account* permission. The account owning the centrally managed shared provider gets `403 shared-sso-provider`.
      operationId: accounts_delete-oidc-provider
      parameters: []
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete the current account's OIDC provider
      tags:
      - Accounts
      x-sdk-params: false
    get:
      description: |-
        Returns the identity provider members of the account the access token was issued for sign in through with single sign-on. The client secret is never returned; `clientSecretSet` reports whether one is stored.

        Returns `404 oidc-provider-not-configured` when the account has no provider, and `409 sso-multiple-providers` when it has more than one. Requires the *Manage my account* permission. The account owning the centrally managed shared provider gets `403 shared-sso-provider`.
      operationId: accounts_get-oidc-provider
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOIDCProvider"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the current account's OIDC provider
      tags:
      - Accounts
      x-sdk-params: false
    patch:
      description: |-
        Changes the identity provider members of the account the access token was issued for sign in through with single sign-on. Fields left out keep their current value; the client secret is changed with `PUT /v1/account/oidc-provider/client-secret`.

        When `providerName` or `tenant` changes, the tenant must name a single organisation or the request returns `400 invalid-tenant`, and the provider's OpenID discovery document is fetched before anything is stored; a provider that cannot be reached returns `400 oidc-discovery-failed`. Returns `404 oidc-provider-not-configured` when the account has no provider, and `409 oidc-provider-changed` when it was changed concurrently. The change is written to the audit log. Requires the *Manage my account* permission. The account owning the centrally managed shared provider gets `403 shared-sso-provider`.
      operationId: accounts_update-oidc-provider
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountOIDCProviderPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOIDCProvider"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update the current account's OIDC provider
      tags:
      - Accounts
      x-sdk-params: false
    post:
      description: |-
        Registers the identity provider members of the account the access token was issued for sign in through with single sign-on. An account has at most one provider; creating a second returns `409 oidc-provider-exists`. Creating a provider does not enable the `sso` sign-in method; enable it with `PATCH /v1/account/auth-options` afterwards.

        The tenant must name a single organisation (Microsoft's `common`, `organizations` and `consumers` are rejected) or the request returns `400 invalid-tenant`. The provider's OpenID discovery document is fetched before anything is stored, and a provider that cannot be reached returns `400 oidc-discovery-failed`. The change is written to the audit log. Requires the *Manage my account* permission. The account owning the centrally managed shared provider gets `403 shared-sso-provider`.
      operationId: accounts_create-oidc-provider
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPostOIDCProviderReqBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOIDCProvider"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create the current account's OIDC provider
      tags:
      - Accounts
      x-sdk-params: false
