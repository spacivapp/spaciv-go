      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: "Matches entries having, for each word of the query, a word containing\
          \ it either from its start or from a point with at least three characters\
          \ left, within its first 40 characters. So \"oo\" and \"oom\" find \"Meeting\
          \ Room\" but \"om\" does not. Word order does not matter. Omit it to browse\
          \ the group from the start."
        explode: false
        in: query
        name: q
        required: false
        schema:
          description: "Matches entries having, for each word of the query, a word\
            \ containing it either from its start or from a point with at least three\
            \ characters left, within its first 40 characters. So \"oo\" and \"oom\"\
            \ find \"Meeting Room\" but \"om\" does not. Word order does not matter.\
            \ Omit it to browse the group from the start."
          type: string
        style: form
      - description: "Entry ids to resolve by name instead of searching, repeated\
          \ once per id. At most 200 per request; resolve a longer selection in batches."
        explode: false
        in: query
        name: ids
        required: false
        schema:
          description: "Entry ids to resolve by name instead of searching, repeated\
            \ once per id. At most 200 per request; resolve a longer selection in\
            \ batches."
          items:
            type: string
          type: array
        style: form
      - description: "Maximum number of entries to return. Defaults to 25 when omitted\
          \ or 0, and is capped at 100."
        explode: false
        in: query
        name: limit
        required: false
        schema:
          description: "Maximum number of entries to return. Defaults to 25 when omitted\
            \ or 0, and is capped at 100."
          format: int32
          maximum: 100
          minimum: 0
          type: integer
        style: form
      - description: Opaque cursor from a previous response.
        explode: false
        in: query
        name: cursor
        required: false
        schema:
          description: Opaque cursor from a previous response.
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectGroupEntrySearchRes"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
