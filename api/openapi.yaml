              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke an API key
      tags:
      - Authentication
      x-sdk-params: false
  /v1/assistant/chat:
    post:
      description: "Submits a message to the assistant and dispatches it for asynchronous\
        \ processing. Returns a `conversationId` and a `requestId` immediately; the\
        \ reply arrives out-of-band, through `GET /v1/assistant/conversations/{id}/poll`.\
        \ If `conversationId` is omitted a new conversation is started. `attachmentFileIds`\
        \ attaches up to 10 distinct files from account file storage and requires\
        \ View file storage permission. Files cannot be attached while the account\
        \ has turned the assistant's tools off. Returns `409` if `conversationId`\
        \ names a conversation that cannot take messages: a subsession the assistant\
        \ started for a tool call, which only ever answers the task it was given,\
        \ or a deleted conversation. Requires the *AI assistant* permission."
      operationId: assistant_create-chat
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantChatReq"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatRes"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send a chat message
      tags:
      - Assistant
      x-sdk-params: false
  /v1/assistant/config:
    get:
      description: "Returns the account's assistant configuration: whether the account\
        \ may reach the Spaciv MCP server, the AI budget in credits the account has\
        \ set for itself (`budgetLimitCredits`, `null` when it has set none) along\
        \ with the most it may set that budget to (`budgetLimitMaxCredits`, `null`\
        \ for no ceiling, and what holds the account where it has set no budget of\
        \ its own or a larger one) and the minimum it is charged whatever it sets\
        \ (`budgetLimitMinCredits`, `null` for none, and not a bound on the budget:\
        \ an account may cap itself below it), what a credit costs the account in\
        \ euros, what it has spent so far this month (`spentCredits`, `null` while\
        \ that figure is unavailable), and the models it permits (empty for all of\
        \ them). Every credit figure is `null` rather than `0` where there is none,\
        \ so that no amount stands for the absence of one. `models` lists the whole\
        \ catalogue, not just the permitted subset, so that the settings page can\
        \ offer the models the account has not permitted. Requires either the *AI\
        \ assistant* or the *Manage my account* permission."
      operationId: assistant_get-config
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConfigBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the assistant configuration
      tags:
      - Assistant
      x-sdk-params: false
    put:
      description: "Sets the account's assistant configuration. An `llmModel` here\
        \ becomes the default for every conversation in the account, overriding the\
        \ application default; send it empty to clear that override. `toolsEnabled`\
        \ controls whether the account may reach the Spaciv MCP server. `budgetLimit`\
        \ records the account's AI budget: omit it to leave the budget unchanged,\
        \ send `{}` to set no limit of the account's own, or send `{\"credits\": n}`\
        \ to cap the account at `n` credits, of which there are 1000 to the US dollar.\
        \ A limit must not exceed `budgetLimitMaxCredits` as the configuration endpoint\
        \ reports it for the account, and must be a budget of something rather than\
        \ `0`. It may sit below `budgetLimitMinCredits`, which is a minimum charge\
        \ rather than a bound, so that an account may cap what its current work costs.\
        \ Where terms agreed with the account cap it, setting no limit of its own\
        \ leaves it capped at those terms, which the configuration endpoint reports\
        \ as `budgetLimitMaxCredits` rather than as a limit of the account's own.\
        \ `permittedModels` restricts the models the account may use, and an empty\
        \ list permits every model; unlike the other fields it is always replaced\
        \ rather than merged, so a request that omits it clears it. Restricting `permittedModels`\
        \ so that they exclude a default set by an earlier request clears that default.\
        \ Returns `400` for an unsupported model, for an `llmModel` the same request\
        \ does not permit, or for a budget above the permitted maximum. Requires the\
        \ *Manage my account* permission."
      operationId: assistant_update-config
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantConfigPutReq"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConfigPutRes"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set the assistant configuration
      tags:
      - Assistant
      x-sdk-params: false
  /v1/assistant/conversations:
    get:
      description: Returns the caller's own assistant conversations in the current
        project. A conversation belongs to the user who started it and is not visible
        to anyone else. Requires the *AI assistant* permission.
      operationId: assistant_list-conversations
      parameters: []
      responses:
        "200":
