  /v1/object-groups/{id}/entries/search:
    get:
      description: |-
        Returns entries matching `q`, as id and name only, with an opaque `cursor` for the next page when one exists. Each request reads a bounded slice of the index, so a page can hold fewer than `limit` entries and still carry a `cursor`.

        A group whose entries predate the search index answers `indexing` while one is built in the background, and the same query answers normally once it is. An empty `q` returns the group from the start, so a picker has something to show before anything is typed.

        Pass `ids` instead of `q` to resolve known entries by name, for selections a search result does not cover. At most 200 per request; resolve a longer selection in batches.

        Returns `400` for more than 200 `ids`, or for a `cursor` that did not come from this group and this query. Returns `404` if the group does not exist. Callers with only the *View public objects* permission receive a `403` instead, and also if the group is not public.
