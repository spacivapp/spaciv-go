  /v1/dashboards/{id}/cards:
    delete:
      description: Removes the card at the given zero-based `index` from the dashboard's
        card list. Cards that follow it are shifted up. Out-of-range indices are silently
        ignored. Returns `404` if the dashboard does not exist. Requires the *Edit
        org model* permission.
      operationId: dashboards_delete-cards
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardCardDelete"
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a card from a dashboard
      tags:
      - Dashboards
      x-sdk-params: false
    patch:
      description: "Applies a single action to a card on a dashboard. Use `moveCard`\
        \ to swap two cards by their zero-based indices, `reorderCard` to move the\
        \ card at `oldIndex` to `newIndex` (zero-based) while shifting the cards in\
        \ between, or `updateCard` to replace the content of a card at a given index,\
        \ including the order of its visualisation and control items. Out-of-range\
        \ indices are silently ignored. Returns `400` when a row-break card has items\
        \ or a control is missing a variable or duplicates another control on the\
        \ same card. Returns `404` if the dashboard does not exist. Requires the *Edit\
        \ org model* permission, and the *Variable controls* permission when the update\
        \ adds, removes, reorders or changes a card's controls."
      operationId: dashboards_update-cards
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
