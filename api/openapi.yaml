openapi: 3.1.0
info:
  contact:
    email: support@spaciv.com
    name: spaciv support
  description: |-
    The spaciv API powers workplace planning: modelling how many people an
    organisation has, how they work, and how much space that requires.

    ## Getting started

    1. Exchange credentials for an access token using one of the operations under
       **Authentication**.
    2. Send that token on every subsequent request as `Authorization: Bearer <token>`.
    3. Access tokens are short lived. Call `POST /v1/auth/refresh-token` to obtain a new one
       before the old one expires.

    ## Conventions

    Every operation is versioned under `/v1`. Collections are plural
    (`GET /v1/dashboards` lists, `POST /v1/dashboards` creates) and
    individual records live beneath them (`/v1/dashboards/{id}`). Singular
    paths such as `/v1/account`, `/v1/project` and `/v1/user`
    refer to the record the access token was issued for.

    Request and response bodies are JSON. Timestamps are RFC 3339. Identifiers are
    opaque strings unless documented otherwise, and collection operations return the
    records visible to the account the token was issued for.

    Failures return an [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem
    document with a `detail` field describing what went wrong.
  title: spaciv API
  version: 1.0.0
servers:
- description: Production
  url: https://api.spaciv.com
- description: Local development
  url: http://localhost:8090
security:
- accessToken: []
tags:
- description: "Exchange credentials for an access token and keep it fresh, and manage\
    \ the long-lived API keys used for programmatic access. Every other section assumes\
    \ a valid token."
  name: Authentication
- description: "Organisation-level records: profile details, hostname, available sign-in\
    \ methods and onboarding progress."
  name: Accounts
- description: "Files uploaded against an account, available to the users in it whose\
    \ roles grant access to them."
  name: Files
- description: "People inside an account, the roles granted to them, and their profile\
    \ images."
  name: Users
- description: "The workspace that scenarios, datasets and dashboards belong to."
  name: Projects
- description: Prebuilt projects used as the starting point for a new one.
  name: Template projects
- description: "Account-level variables shared by projects, dashboards and analysis\
    \ inputs."
  name: Variables
- description: Named variants of a project used to compare different assumptions side
    by side.
  name: Scenarios
- description: The buildings and sites a project is modelled against.
  name: Properties
- description: "Reusable groupings of modelled objects, their entries and attached\
    \ files."
  name: Object groups
- description: Uploaded floor plan drawings and the space data derived from them.
  name: Floor plans
- description: "Layers that balance supply against demand, such as the space that\
    \ headcount and activity need, plus their illustrative images."
  name: Logic layers
- description: Ratio-driven space models built from organisation-wide totals rather
    than individual teams.
  name: Top-down models
- description: Demand estimates derived from a top-down model.
  name: Needs
- description: Collections of records that supply the numbers behind a model.
  name: Datasets
- description: "Surveys sent to colleagues to gather demand data, and the links and\
    \ QR codes that open them."
  name: Data collection
- description: "Survey responses submitted by a contributor, including the public\
    \ submission flow."
  name: Contributions
- description: Runs a scenario through the calculation engine and streams back the
    resulting model.
  name: Analysis
- description: "Saved layouts of cards that visualise a project's results, and the\
    \ individual cards placed on them."
  name: Dashboards
- description: Exports of a project's results as a downloadable document.
  name: Reports
- description: Conversational assistant backed by the project's data.
  name: Assistant
- description: Connections to third-party tools such as Slack.
  name: Integrations
- description: "Your own Python, Go or JavaScript code that Spaciv runs in a sandbox\
    \ on a schedule or from a webhook, with an API key that rotates automatically."
  name: Scripts
- description: "Customer-supplied logo and sign-in page background, and the public\
    \ branding a sign-in page renders for a hostname."
  name: Branding
- description: Available locales and the translated strings served to clients.
  name: Localisation
- description: Static reference lists used to populate form fields.
  name: Lookups
- description: "A record of who changed what, and when."
  name: Audit log
- description: Liveness and build information for the API itself.
  name: Service
- description: Operations reserved for spaciv tooling. Not part of the supported surface
    and may change without notice.
  name: Internal
paths:
  /:
    get:
      description: Returns `ok` when the API is running and reachable. No authentication
        required. Use as a liveness probe.
      operationId: service_get
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Check service health
      tags:
      - Service
      x-sdk-params: false
  /v1/account:
    delete:
      description: "Permanently deletes the account the access token was issued for,\
        \ along with its projects, members and scripts. This cannot be undone. Scripts\
        \ are deleted first, so if the request fails some of them may already be gone;\
        \ repeat it to finish deleting the account. Requires the *Manage my account*\
        \ permission. A script's own API key cannot delete the account."
      operationId: accounts_delete
      parameters: []
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete the current account
      tags:
      - Accounts
      x-sdk-params: false
    get:
      description: "Returns the account the access token was issued for. Use `GET\
        \ /v1/account/profile` for the full profile, including address and notification\
        \ preferences. Requires the *View account overview* permission."
      operationId: accounts_get
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the current account
      tags:
      - Accounts
      x-sdk-params: false
    patch:
      description: Updates the account the access token was issued for. Only the fields
        present in the body are changed; omitted fields keep their current values.
        Requires the *Manage my account* permission.
      operationId: accounts_update
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPutReqBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update the current account
      tags:
      - Accounts
      x-sdk-params: false
  /v1/account/auth-options:
    get:
      description: |-
        Returns every sign-in method configured for the account the access token was issued for, enabled or not, so it can be administered, along with whether single sign-on is available at all. Requires the *Manage my account* permission.

        Use `/v1/auth/options/{hostname}` instead to render a sign-in screen.
      operationId: accounts_list-auth-options
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountGetAuthOptionsResBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the current account's sign-in methods
      tags:
      - Accounts
      x-sdk-params: false
    patch:
      description: |-
        Enables or disables sign-in methods for the account the access token was issued for, and returns the full set as it now stands. Methods left out of the body keep their current setting, and a method listed more than once takes its last entry.

        Disabling the last enabled method returns `400 last-auth-option-disabled`, and enabling `sso` returns `400 sso-not-configured` when the account has no OIDC provider or `400 sso-multiple-providers` when it has more than one, as signing in with SSO resolves exactly one provider. An `sso` method already enabled without exactly one provider does not count as an enabled method. Disabling `sso` stops sign-in through the account's own identity provider; an account whose single sign-on comes from a centrally managed shared provider keeps that route whatever this setting says. A concurrent change to the account's sign-in methods, or removal of the OIDC provider the result relies on, returns `409 auth-options-changed`, and the request may be retried. Requires the *Manage my account* permission.
      operationId: accounts_update-auth-options
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatchAuthOptionsReqBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AccountAuthOption"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update the current account's sign-in methods
      tags:
      - Accounts
      x-sdk-params: false
  /v1/account/directories:
    get:
      description: |-
        Returns a page of every directory in the account's files, at any depth, in the order they were created. Each directory gives its parent's identifier, so a client that fetches every page can build the whole tree. To list what is inside one directory, list the account's files with `parent` instead.

        When `nextCursor` is present there are more directories to fetch; pass it back as `cursor` to retrieve the following page. Requires the *View file storage* permission.
      operationId: files_list-account-directories
      parameters:
      - description: Maximum number of directories to return in this page.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Maximum number of directories to return in this page.
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: Opaque pagination cursor returned as nextCursor by a previous
          response. A cursor is only valid for the account it was issued to.
        explode: false
        in: query
        name: cursor
        required: false
        schema:
          description: Opaque pagination cursor returned as nextCursor by a previous
            response. A cursor is only valid for the account it was issued to.
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the account's directories
      tags:
      - Files
      x-sdk-params: true
    post:
      description: |-
        Creates a directory to organise the files stored against the account, at the root or inside another directory, and returns it. Directories can be nested at most 8 deep. The name is normalised to Unicode NFC, and names are unique within a directory among its files and directories, compared exactly: a name already taken there by a file or a directory is rejected with 409. Returns 404 if the account has no directory with the given `parentId`.

        A directory takes up none of the account's storage quota. Requires the *Edit file storage* permission.
      operationId: files_create-account-directories
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDirectoryPostBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Directory"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a directory in the account's files
      tags:
      - Files
      x-sdk-params: false
  /v1/account/directories/{id}:
    delete:
      description: "Deletes an empty directory from the account's files. A directory\
        \ that still holds a file or another directory is rejected with 409 `directory\
        \ is not empty`: move or delete its contents first. Deleting a directory that\
        \ is already gone succeeds rather than returning 404. Any other 409 means\
        \ the directory changed during the request, and the request can be retried.\
        \ Requires the *Edit file storage* permission."
      operationId: files_delete-account-directories
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDirectoryDeleteResponseWrapperBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a directory
      tags:
      - Files
      x-sdk-params: false
    patch:
      description: |-
        Changes a directory's name, moves it into another directory, changes its tags, or any of these, and returns the updated directory. Give `name`, `parentId`, `addTags`, `removeTags` or any of them; a body with none is rejected with 400. Everything inside the directory moves with it and keeps its identifier, so anything referencing those files keeps working. A rename or move and a tag change made in one request are saved, and audited, one after the other.

        The name is normalised to Unicode NFC, and names are unique within a directory among its files and directories, compared exactly: a name already taken in the destination by a file or another directory, whether by a rename or a move, is rejected with 409. Moving a directory into itself or into a directory inside it, or so that something inside it would be nested more than 8 deep, is rejected with 400.

        Tags are added and removed as given, without replacing the directory's other tags, so two people tagging the same directory at once do not undo each other's changes. A tag cannot be both added and removed in one request. The files and directories inside do not take on the directory's tags.

        Some tags are reserved: they give an item a meaning Spaciv acts on, and `GET /v1/account/file-tags` lists them. `skill` marks a directory as a skill. Adding or removing a reserved tag, or renaming, moving, retagging or deleting a directory that has one, needs the permission that tag requires (*Manage my account* for `skill`), and so does any change to a directory inside one that has it, at any depth, including moving it into or out of one; otherwise the request is rejected with 403. A reserved tag may check the directory it is on, when it is added and whenever the directory or anything inside it changes, and record what it finds in `tagProblems` rather than refusing the change.

        Returns 404 if the account has no directory with this identifier, or none with the given `parentId`. Any other 409 means the account's directories changed during the request, and the request can be retried. Requires the *Edit file storage* permission.
      operationId: files_update-account-directories
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDirectoryPatchBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Directory"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Rename, move or tag a directory"
      tags:
      - Files
      x-sdk-params: false
  /v1/account/duplicate:
    post:
      description: |-
        Creates a new account owned by the authenticated user and copies the current account's content into it: projects, dashboards, floor plans, properties, object groups, top-down models, scenarios, datasets, space rulesets, variables, and files with their folders. Archived projects, object groups, scenarios and top-down models are copied and stay archived. Data collections are copied as drafts without their contributors. Members and their roles, sign-in settings, API keys, scripts, assistant conversations and the audit log are not copied; the caller is the new account's only member. Returns the new account's identifier.

        Copying runs in the background, so poll `GET /v1/accounts/{id}/setup-status` until it succeeds before sending the user into the new account; it returns `500 account-setup-failed` if the content could not be copied, and the incomplete account is then deleted, after which polling it returns `403`.

        Account names are unique; reusing one returns `400 account-name-in-use`. Requires a token for the account being duplicated, holding the *Manage my account* permission; a token for no account returns `400`. A script's own API key cannot duplicate an account.
      operationId: accounts_duplicate
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDuplicateReqBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                format: int64
                type: integer
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Duplicate the current account
      tags:
      - Accounts
      x-sdk-params: false
  /v1/account/file-tags:
    get:
      description: |-
        Returns every tag in use on the account's files and directories, each once, for suggesting tags as they are typed. Pass one to the list operation's `tag` to list the files and directories that have it. A tag that has just been added or removed may take a moment to be reflected here.

        Also returns the reserved tags, which give an item a meaning Spaciv acts on, with the kinds of item each can be added to. Requires the *View file storage* permission.
      operationId: files_list-account-file-tags
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the account's file and directory tags
      tags:
      - Files
      x-sdk-params: false
  /v1/account/files:
    get:
      description: |-
        Without `parent` or `tag`, returns a page of every file stored against the account, whatever directory it is in, most recently uploaded first. Files belonging to other accounts are never returned.

        With `parent`, returns a page of what is directly inside that directory, or inside the root when `parent` is `root`: its directories in `directories`, most recently created first, then its files in `files`, most recently uploaded first. Returns 404 if the account has no directory with that identifier.

        With `tag`, returns a page of the files and directories that have that tag, wherever they are: the files in `files` and the directories in `directories`, each most recently created first. The contents of a tagged directory are not included unless they have the tag themselves. Giving both `parent` and `tag` is rejected with 400, and so is a tag that is not at most 32 letters, digits and hyphens.

        When `nextCursor` is present there are more items to fetch; pass it back as `cursor`, with the same `parent` or `tag`, to retrieve the following page. A page may come back shorter than `limit` while still having a `nextCursor`, and may have neither files nor directories.

        A file that has just been uploaded, moved, renamed or tagged may not show its change here immediately, so clients should apply the record returned by the upload or update operation to their list rather than refetching. Requires the *View file storage* permission.
      operationId: files_list-account-files
      parameters:
      - description: Maximum number of files to return in this page.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Maximum number of files to return in this page.
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: "Opaque pagination cursor returned as nextCursor by a previous\
          \ response. A cursor is only valid for the account, and the parent or tag,\
          \ it was issued for."
        explode: false
        in: query
        name: cursor
        required: false
        schema:
          description: "Opaque pagination cursor returned as nextCursor by a previous\
            \ response. A cursor is only valid for the account, and the parent or\
            \ tag, it was issued for."
          type: string
        style: form
      - description: "List only what is directly inside this directory: a directory\
          \ identifier, or root for the root. Leave it out to list every file of the\
          \ account, whatever directory it is in. Cannot be given with tag."
        explode: false
        in: query
        name: parent
        required: false
        schema:
          description: "List only what is directly inside this directory: a directory\
            \ identifier, or root for the root. Leave it out to list every file of\
            \ the account, whatever directory it is in. Cannot be given with tag."
          type: string
        style: form
      - description: "List only the files and directories with this tag, wherever\
          \ they are. Matched without regard to case. Cannot be given with parent."
        explode: false
        in: query
        name: tag
        required: false
        schema:
          description: "List only the files and directories with this tag, wherever\
            \ they are. Matched without regard to case. Cannot be given with parent."
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the account's files
      tags:
      - Files
      x-sdk-params: true
    post:
      description: |-
        Stores a file against the account and returns the record describing it. Send the request as `multipart/form-data` with a single file field named `file`, and optionally a `parentId` field naming the directory to store it in; without one the file goes in the root, and a `parentId` the account has no directory for is rejected with 404. The uploaded file's name, normalised to Unicode NFC, becomes the record's `name`, so it must be non-empty and free of `/` and `\`; a name over 255 bytes is shortened to fit, keeping its extension. Names are unique within a directory among its files and directories, compared exactly, so `Report.pdf` and `report.pdf` can sit side by side: when the name is already taken there, the file is stored under the lowest free numbered name instead, such as `image (2).png`, with the number before the extension, and the response's `name` is the name it was stored under. Any media type is accepted; `mimeType` is detected from the file's contents rather than from its name or the type the client declared. Maximum file size is 25 MiB, and uploads are rejected if a virus scan fails.

        The files stored against an account may total at most 1 GiB. An upload that would take the account past that is rejected with 413 and no file is added to the account, though the uploaded bytes may briefly remain in storage until they are cleaned up; deleting files frees their space. A 409 means concurrent uploads kept changing the account's usage or taking the names it tried, and the upload can be retried as it stands.

        Uploading into a directory that has a reserved tag, or into any directory inside one at any depth, needs the permission that tag requires (*Manage my account* for `skill`); otherwise the upload is rejected with 403 and no file is added to the account. `GET /v1/account/file-tags` lists the reserved tags.

        The response body is the same record shape the list operation returns, so a client can add it to a list it already holds instead of refetching. Requires the *Edit file storage* permission.
      operationId: files_create-account-files
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/files_create_account_files_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload a file to the account
      tags:
      - Files
      x-sdk-params: true
  /v1/account/files/{id}:
    delete:
      description: |-
        Permanently deletes a file stored against the account, removing both its record and its stored content. This cannot be undone and any link to the file stops working. The file's size stops counting towards the account's 1 GiB storage quota once its record is removed.

        The record is removed before the content, so a request that fails partway can leave the stored content behind; repeating the same request is what clears it. Deleting a file that is already gone succeeds rather than returning 404, so a failed delete should always be retried; that includes a 409, which means concurrent changes to the account's files kept changing its storage usage during the request. The identifier must be one returned by the upload or list operations; a malformed identifier is rejected with 400. Requires the *Edit file storage* permission.
      operationId: files_delete-account-files
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountFileDeleteResponseWrapperBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete an account file
      tags:
      - Files
      x-sdk-params: false
    patch:
      description: |-
        Changes the display name of a file stored against the account, moves it into another directory, changes its tags, or any of these, and returns the updated record. Give `name`, `parentId`, `addTags`, `removeTags` or any of them; a body with none is rejected with 400. The stored content, media type, size and identifier are untouched, so anything already referencing the file keeps working. A rename or move and a tag change made in one request are saved, and audited, one after the other.

        The name is normalised to Unicode NFC, and names are unique within a directory among its files and directories, compared exactly. Giving a `name` already taken in the destination is rejected with 409. A move that gives only `parentId` never fails for its name: if the file's name is taken in the destination, it is stored under the lowest free numbered name instead, such as `lease (2).pdf`, and a name normalising makes longer than 255 bytes is shortened to fit; the response's `name` is the name it now has.

        Tags are added and removed as given, without replacing the file's other tags, so two people tagging the same file at once do not undo each other's changes. A tag cannot be both added and removed in one request.

        Some tags are reserved: they give an item a meaning Spaciv acts on, and `GET /v1/account/file-tags` lists them. A reserved tag can only be added to the kinds of item it applies to, so `skill` on a file is rejected with 400. Adding or removing a reserved tag, or renaming, moving, retagging or deleting an item that has one, needs the permission that tag requires (*Manage my account* for `skill`), and so does any change to a file inside a directory that has one, at any depth, including moving the file into or out of it; otherwise the request is rejected with 403. A reserved tag may check the item it is on, when it is added and after the item changes, and record what it finds in `tagProblems` rather than refusing the change.

        The identifier must be one returned by the upload or list operations; a malformed identifier is rejected with 400. Returns 404 if the account has no file with this identifier, or no directory with the given `parentId`. Any other 409 means the file changed during the request, and the request can be retried as it stands. Requires the *Edit file storage* permission.
      operationId: files_update-account-files
      parameters:
      - explode: false
        in: path
        name: id
        required: true
