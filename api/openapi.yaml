        explode: false
        in: path
        name: id
        required: true
        schema:
          description: Identifier returned by POST /v1/accounts or POST /v1/account/duplicate.
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
