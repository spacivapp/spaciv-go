        \ be a per-object expression: numbers, static property references, the add,\
        \ subtract, multiply and divide operators, and `condition` (if a comparison\
        \ or a `has` test, then one expression, else another). With `variable_controls`\
        \ enabled, formulas may also reference numeric account variables by `account:<id>`;\
        \ other variable references are rejected. `sumOf`, `select`, unknown operators\
        \ and references to unknown properties or nodes are rejected with `400` naming\
        \ the offending field. Returns `404` if the model does not exist. Requires\
        \ the *Edit modification* permission."
      operationId: top-down-models_update-entries
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopDownModelEntryUpdate"
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create or update a top-down model entry
      tags:
      - Top-down models
      x-sdk-params: false
