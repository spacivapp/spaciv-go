  /v1/top-down-models/{id}/entries:
    delete:
      description: Permanently removes one or more entries from the specified top-down
        model. The request body is an array of entry IDs to delete. Requires the *Edit
        modification* permission.
      operationId: top-down-models_delete-entries
      parameters:
      - explode: false
        in: path
