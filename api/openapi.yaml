  /v1/admin/reconcile-file-storage:
    post:
      description: |-
        Compares the account file storage bucket with the file records, in both directions, and reports every difference. Requires the *Project admin controls* and *Sys admin* permissions.

        An **orphan** is a stored object with no record. With `apply`, an orphan older than 24 hours is deleted after a system audit entry is written to its account's file audit trail; younger orphans may be uploads still in flight and are always kept. Orphans under an account that no longer exists, and keys that are not `account/{accountId}/{fileId}`, are reported and never deleted. Deleting an orphan never changes an account's storage usage, which counts records only.

        A **dangling record** is a record whose object is missing. It is reported, and logged as an error, but never changed: it still counts towards the account's usage until it is deleted through the file delete operation.

        Without `apply` nothing is changed. A run over every account may take minutes; pass `account` to limit it.

        `apply` is refused with 403 unless the environment sets `SPACIV_FILE_STORAGE_RECONCILE_APPLY` to `true`. Production sets it to `false`.
      operationId: internal_create-admin-reconcile-file-storage
      parameters:
      - description: Delete the orphaned objects that qualify. Omit to report what
          would be deleted and change nothing.
        explode: false
        in: query
        name: apply
        required: false
        schema:
          description: Delete the orphaned objects that qualify. Omit to report what
            would be deleted and change nothing.
          type: boolean
        style: form
      - description: Reconcile only this account. Omit to reconcile every account
          and every object in the bucket.
        explode: false
        in: query
        name: account
        required: false
        schema:
          description: Reconcile only this account. Omit to reconcile every account
            and every object in the bucket.
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileReport"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reconcile account file storage
      tags:
      - Internal
      x-sdk-params: true
