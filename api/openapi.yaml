    delete:
      description: |-
        Permanently removes one or more entries from the specified object group. Each item in the body must include the `id` of the entry to delete. Removing an entry that is not there succeeds and leaves the group's counts alone. Deleted entries are removed from every object variable's allowed `options`; a variable whose value included them keeps its other allowed objects, or moves to its first remaining option. Once no option is left, every object is allowed again and the value is left as it was.

        Returns `404` if the object group does not exist, and `409` if an entry keeps being changed by other writers while it is being deleted. Entries are deleted one at a time, so a failure part way through leaves the earlier ones deleted; re-sending the same request finishes the job. Requires the *Edit objects* permission.
      operationId: object-groups_delete-entries
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: "#/components/schemas/ObjectGroupEntryUpdate"
              type: array
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete entries from an object group
      tags:
      - Object groups
      x-sdk-params: false
    get:
      description: |-
        Returns a page of entries belonging to the specified object group, along with the total entry count and an opaque `cursor` for the next page. A page can hold fewer than `limit` entries, or none, and still carry a `cursor`: keep requesting until `cursor` is empty. Pages reached by a non-zero `start` carry no `cursor`.

        Returns `400` for a `cursor` that did not come from this group. Returns `404` if the group does not exist. Callers with only the *View public objects* permission receive a `403` instead, and also if the group is not public.
      operationId: object-groups_list-entries
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: "Zero-based index of the first entry to return. Defaults to 0.\
          \ Prefer cursor: reaching a later index costs a read of every entry before\
          \ it."
        explode: false
        in: query
        name: start
        required: false
        schema:
          description: "Zero-based index of the first entry to return. Defaults to\
            \ 0. Prefer cursor: reaching a later index costs a read of every entry\
            \ before it."
          format: int32
          type: integer
        style: form
      - description: Maximum number of entries to return. Defaults to 100 when omitted
          or 0.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          description: Maximum number of entries to return. Defaults to 100 when omitted
            or 0.
          format: int32
          type: integer
        style: form
      - description: Opaque cursor from a previous response. Takes precedence over
          start.
        explode: false
        in: query
        name: cursor
        required: false
        schema:
          description: Opaque cursor from a previous response. Takes precedence over
            start.
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectGroupEntriesRes"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List entries in an object group
      tags:
      - Object groups
      x-sdk-params: true
    patch:
      description: |-
        Applies a partial update to one or more existing entries within the specified object group. Each item in the body must include the `id` of an entry that already exists, and the same `id` cannot be listed twice; use `PUT` to create entries and `DELETE` to remove them.

        Only the fields present in an item are changed, and `properties` merges one property at a time: a property named in the request replaces that property's nodes, a property named with a `null` value or an empty `nodes` map is removed from the entry, and a property the request does not name is left as-is.

        Every entry is resolved before any of them is written, so a `404` means nothing was changed; an entry deleted after that point reports as a `409` instead. Writing is one transaction per entry rather than a single atomic batch, so a failure once writing has begun leaves the earlier entries updated; the error names them. Re-sending the same request finishes the job, since applying a patch twice is a no-op. Returns `409` if an entry is being changed concurrently and the write cannot be retried safely. Requires the *Edit objects* permission, and *View file storage* to link a File property to a file it was not already linked to.
      operationId: object-groups_update-entries
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: "#/components/schemas/EntryPatch"
              type: array
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Partially update entries in an object group
      tags:
      - Object groups
      x-sdk-params: false
    put:
