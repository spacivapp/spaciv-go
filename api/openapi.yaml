          format: date-time
          type: string
        oidcProviderId:
          format: int64
          type: integer
        providerName:
          description: Identity provider product the account signs in through.
          enum:
          - microsoft
          - pingfederate
          type: string
        tenant:
          description: "Organisation at the identity provider: a Microsoft Entra tenant\
            \ ID or verified domain, or the PingFederate domain."
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - clientId
      - clientSecretSet
      - createdAt
      - oidcProviderId
      - providerName
      - tenant
      - updatedAt
    AccountOIDCProviderPatch:
      additionalProperties: false
      example:
        clientId: clientId
        providerName: microsoft
        tenant: tenant
      not:
