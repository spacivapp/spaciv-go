    AccountDirectoryDeleteResponseWrapperBody:
      additionalProperties: false
      type: object
    AccountDirectoryPatchBody:
      additionalProperties: false
      example:
        addTags:
        - addTags
        - addTags
        - addTags
        - addTags
        - addTags
        removeTags:
        - removeTags
        - removeTags
        - removeTags
        - removeTags
        - removeTags
        name: name
        parentId: parentId
      properties:
        addTags:
          description: "Tags to add to the directory. Each is lowercased and must\
            \ then be at most 32 letters, digits and hyphens, starting with a letter\
            \ or digit. A directory can have at most 20 tags."
          items:
            type: string
          maxItems: 20
          type: array
        name:
          description: "New display name for the directory. At most 255 bytes after\
            \ normalising to Unicode NFC. Must not contain a forward slash or a backslash,\
            \ and must not be . or .."
          minLength: 1
          type: string
        parentId:
          description: "Identifier of the directory to move this one into, or an empty\
            \ string to move it to the root."
          type: string
        removeTags:
          description: Tags to remove from the directory. Removing a tag the directory
            does not have changes nothing.
          items:
            type: string
          maxItems: 20
          type: array
    AccountDirectoryPostBody:
      additionalProperties: false
      example:
        name: name
        parentId: parentId
      properties:
        name:
          description: "Display name of the directory. At most 255 bytes after normalising\
            \ to Unicode NFC. Must not contain a forward slash or a backslash, and\
            \ must not be . or .."
          minLength: 1
          type: string
        parentId:
          description: Identifier of the directory to create this one in. Leave it
            out to create it at the root.
          type: string
      required:
      - name
    AccountDuplicateReqBody:
      additionalProperties: false
      example:
        name: name
      properties:
        name:
          description: Display name of the new account. Must not already be in use.
          minLength: 1
          type: string
      required:
      - name
    AccountFileDeleteResponseWrapperBody:
      additionalProperties: false
      type: object
    AccountFilePatchBody:
      additionalProperties: false
      example:
        addTags:
        - addTags
        - addTags
        - addTags
        - addTags
        - addTags
        removeTags:
        - removeTags
        - removeTags
        - removeTags
        - removeTags
        - removeTags
        name: name
        parentId: parentId
      properties:
        addTags:
          description: "Tags to add to the file. Each is lowercased and must then\
            \ be at most 32 letters, digits and hyphens, starting with a letter or\
            \ digit. A file can have at most 20 tags."
          items:
            type: string
          maxItems: 20
          type: array
        name:
          description: New display name for the file. At most 255 bytes after normalising
            to Unicode NFC. Must not contain a forward slash or a backslash.
          minLength: 1
          type: string
        parentId:
          description: "Identifier of the directory to move the file into, or an empty\
